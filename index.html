<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高一甲倒計時</title>
    <link rel="icon" type="image/png" href="icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        exam: { light: '#ef4444', text: '#dc2626', badge: '#fee2e2' },
                        activity: { light: '#3b82f6', text: '#2563eb', badge: '#dbeafe' },
                        pending: { light: '#eab308', text: '#ca8a04', badge: '#fef9c3' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300">

    <header class="sticky top-0 z-30 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-pink-500 flex items-center justify-center text-white font-bold text-xl shadow-lg">
                    甲
                </div>
                <h1 class="text-xl sm:text-2xl font-extrabold bg-gradient-to-r from-indigo-600 to-pink-600 dark:from-indigo-400 dark:to-pink-400 bg-clip-text text-transparent">
                    高一甲倒計時
                </h1>
            </div>
            <button onclick="document.documentElement.classList.toggle('dark')" class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800">
                <i class="fa-solid fa-moon dark:hidden"></i>
                <i class="fa-solid fa-sun hidden dark:block text-amber-400"></i>
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
        <div id="countdownGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
    </main>

    <footer class="mt-auto border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-400">
        <p>高一甲班級專用倒計時網站</p>
    </footer>

    <script>
        const items = [
            { title: "第二次段考", date: "2026-12-01", tag: "考試" },
            { title: "校慶運動會", date: "2026-12-05", tag: "活動" },
            { title: "愛心義賣", date: "2026-11-18", tag: "活動" },
            { title: "聖誕點燈", date: "2026-12-08", tag: "活動" },
            { title: "校慶運動會", date: "2026-12-11", tag: "活動" },
            { title: "英語歌唱比賽決賽", date: "2026-12-15", tag: "活動" },
            { title: "校外報佳音週", date: "2026-12-14", tag: "活動" },
            { title: "家長職業探索說明會", date: "2026-11-23", tag: "活動" },
            { title: "第三次段考", date: "2026-01-18", tag: "考試" },
            { title: "拔河比賽", date: "2026-11-09", tag: "活動" },
            { title: "未知的活動", date: "", tag: "未排定" }
        ];

        function getDays(dateStr) {
            if (!dateStr) return null;
            const today = new Date();
            today.setHours(0,0,0,0);
            const target = new Date(dateStr);
            target.setHours(0,0,0,0);
            return Math.ceil((target - today) / (1000 * 60 * 60 * 24));
        }

        function render() {
            const list = items.filter(item => {
                if (item.tag === '未排定' || !item.date) return true;
                const days = getDays(item.date);
                return days >= 0;
            }).sort((a, b) => {
                if (a.tag === '未排定' && b.tag !== '未排定') return 1;
                if (a.tag !== '未排定' && b.tag === '未排定') return -1;
                if (!a.date) return 1;
                if (!b.date) return -1;
                return new Date(a.date) - new Date(b.date);
            });

            document.getElementById('countdownGrid').innerHTML = list.map(item => {
                const days = getDays(item.date);
                const isPending = item.tag === '未排定' || !item.date;

                let tagClass = "bg-amber-50 text-amber-600 border-amber-200 dark:bg-amber-950/40 dark:text-amber-400 dark:border-amber-900";
                let textClass = "text-amber-600 dark:text-amber-400";
                let borderHover = "hover:border-amber-500/50";

                if (item.tag === '考試') {
                    tagClass = "bg-red-50 text-red-600 border-red-200 dark:bg-red-950/40 dark:text-red-400 dark:border-red-900";
                    textClass = "text-red-600 dark:text-red-400";
                    borderHover = "hover:border-red-500/50";
                } else if (item.tag === '活動') {
                    tagClass = "bg-blue-50 text-blue-600 border-blue-200 dark:bg-blue-950/40 dark:text-blue-400 dark:border-blue-900";
                    textClass = "text-blue-600 dark:text-blue-400";
                    borderHover = "hover:border-blue-500/50";
                }

                let daysHTML = '';
                if (isPending) {
                    daysHTML = `<div class="py-4 text-center"><span class="text-base font-bold ${textClass} bg-amber-50 dark:bg-amber-950/40 px-4 py-2 rounded-xl border border-amber-200 dark:border-amber-900/60">日期待定</span></div>`;
                } else if (days === 0) {
                    daysHTML = `<div class="py-2 text-center"><span class="bg-emerald-500 text-white font-extrabold text-xl px-4 py-2 rounded-xl shadow-md">今天！</span></div>`;
                } else {
                    daysHTML = `<div class="flex items-baseline justify-center gap-1 py-1"><span class="text-xs font-bold text-slate-400">剩餘</span><span class="text-4xl font-black ${textClass}">${days}</span><span class="text-sm font-bold text-slate-500">天</span></div>`;
                }

                return `
                    <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 border border-slate-200 dark:border-slate-700 shadow-sm transition-all ${borderHover}">
                        <div class="flex justify-between items-start mb-3">
                            <span class="px-2.5 py-1 rounded-lg text-xs font-bold border ${tagClass}">${item.tag}</span>
                        </div>
                        <div class="my-2 text-center">
                            <h2 class="text-lg font-bold text-slate-800 dark:text-slate-100 mb-1">${item.title}</h2>
                            ${daysHTML}
                        </div>
                        <div class="mt-3 pt-3 border-t border-slate-100 dark:border-slate-700/60 text-xs text-slate-400 flex justify-between">
                            <span>目標日期</span>
                            <span class="font-semibold text-slate-600 dark:text-slate-300">${item.date || '未排定'}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.onload = render;
    </script>
</body>
</html>
