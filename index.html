<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高一甲工具箱</title>
    <link rel="icon" href="icon.png" type="image/png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            padding: 24px;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid #f0f0f0;
        }

        header h1 {
            font-size: 1.5rem;
            color: #1e293b;
        }

        .portal-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .portal-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-radius: 12px;
            text-decoration: none;
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .portal-btn:hover:not(.disabled) {
            border-color: #3b82f6;
            background-color: #eff6ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15);
        }

        .portal-btn.disabled {
            background-color: #f8fafc;
            border-color: #e2e8f0;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .btn-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            text-align: left;
        }

        .btn-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: #0f172a;
        }

        .btn-subtitle {
            font-size: 0.85rem;
            color: #64748b;
        }

        .btn-tag {
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 500;
            white-space: nowrap;
        }

        .tag-disabled {
            background-color: #e2e8f0;
            color: #475569;
        }

        .tag-custom {
            background-color: #dbeafe;
            color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>高一甲工具箱</h1>
        </header>

        <div id="portal-container" class="portal-list"></div>
    </div>

    <script>
        const portalList = [
            {
                title: "分數計算系統",
                subtitle: "分數加權計算",
                tag: "暫不開放",
                url: "#",
                disabled: true
            },
            {
                title: "投稿系統",
                subtitle: "活動投稿",
                tag: "暫不開放",
                url: "#",
                disabled: true
            },
            {
                title: "倒數計時",
                subtitle: "倒數",
                tag: "",
                url: "./countdown.html",
                disabled: false
            }
        ];

        function renderPortals() {
            const container = document.getElementById('portal-container');
            container.innerHTML = portalList.map(item => {
                const isDisabled = item.disabled;
                const tagHtml = item.tag 
                    ? `<span class="btn-tag ${isDisabled ? 'tag-disabled' : 'tag-custom'}">${item.tag}</span>` 
                    : '';

                if (isDisabled) {
                    return `
                        <div class="portal-btn disabled">
                            <div class="btn-info">
                                <span class="btn-title">${item.title}</span>
                                <span class="btn-subtitle">${item.subtitle}</span>
                            </div>
                            ${tagHtml}
                        </div>
                    `;
                } else {
                    return `
                        <a href="${item.url}" class="portal-btn">
                            <div class="btn-info">
                                <span class="btn-title">${item.title}</span>
                                <span class="btn-subtitle">${item.subtitle}</span>
                            </div>
                            ${tagHtml}
                        </a>
                    `;
                }
            }).join('');
        }

        renderPortals();
    </script>
</body>
</html>
